  <!-- Eye -->
  <circle cx="148" cy="58" r="13" fill="#1a1a1a"/>
  <circle cx="152" cy="54" r="5" fill="white"/>
  <circle cx="153" cy="54" r="2" fill="#1a1a1a"/>

  <!-- Nostril -->
