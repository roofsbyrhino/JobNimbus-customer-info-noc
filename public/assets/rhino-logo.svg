<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" role="img" aria-label="Rhino Roofs Logo">
  <!-- Horn -->
  <path d="M 58,88 L 8,30 L 62,68 Z" fill="#c06010"/>

  <!-- Main head silhouette (profile facing left, horn on left) -->
