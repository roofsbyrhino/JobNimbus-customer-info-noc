    M 58,88
    C 54,78 54,64 62,52
    C 70,40 84,30 102,26
    C 122,20 148,22 164,36
    C 178,48 182,66 176,82
    C 172,94 162,102 150,106
    C 162,120 164,138 156,150
    C 146,162 130,164 118,156
    C 106,164 88,166 74,154
    C 58,140 54,118 62,100
    C 60,96 59,92 58,88 Z
  " fill="#F07E26"/>

  <!-- Ear (upper right of head) -->
